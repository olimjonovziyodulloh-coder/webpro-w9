<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — webpro-w9 by Olimjonov Ziyodulloh.">
  <meta name="robots" content="noindex">
  <title>404 — Page not found</title>
  <style>
    :root {
      --bg: #f4f7fc;
      --card: #ffffff;
      --text: #14213d;
      --muted: #55627a;
      --accent: #1d4ed8;
      --line: #d7e0ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    main {
      width: min(620px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(28px, 5vw, 52px);
      box-shadow: 0 18px 45px rgba(20, 33, 61, 0.10);
      text-align: center;
    }

    .code {
      display: inline-block;
      background: #e3ebff;
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 18px;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.08;
      letter-spacing: -1.2px;
    }

    p {
      margin-top: 14px;
      color: var(--muted);
    }

    .actions {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    a {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    a.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      font-weight: 500;
    }

    a:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <span class="code">404</span>
    <h1>Oops — that page doesn't exist.</h1>
    <p>
      The link may be broken, or the page may have been moved. Let's get you
      back to something that works.
    </p>
    <div class="actions">
      <a href="./">Back to Home</a>
      <a class="ghost" href="https://olimjonovziyodulloh-coder.github.io/web_programming/">Course archive</a>
    </div>
    <footer>Olimjonov Ziyodulloh · Web Programming · K0126002</footer>
  </main>
</body>
</html>
